<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 58 14" width="580" height="140" shape-rendering="crispEdges">
  <title>LEDSA</title>
  <desc>LEDSA (LEDSmokeAnalysis) wordmark in 8-bit style. The D carries the diode symbol as a negative-space triangle: the counter of the D is the LED. The E stem is the diode bar; its three arms are the red, green and blue channels, their lengths showing the transmission through smoke.</desc>
  <style>@media (prefers-color-scheme: dark) { .ink { fill: #e8ecf3 } }</style>
