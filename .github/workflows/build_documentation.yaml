# GitHub Actions workflow to build the Sphinx documentation and deploy it to GitHub Pages
name: Docs

# Trigger the workflow on pushes, pull requests, or manual dispatch events,
# except when only README.md changes (the docs do not include it)
on:
  push:              # 1. Rebuild docs on every push to any branch
    paths-ignore:
      - 'README.md'
  pull_request:      # 2. Also run on every pull request
    paths-ignore:
      - 'README.md'
  workflow_dispatch: # 3. Allow manual triggers from the GitHub UI

permissions:
  contents: read    # Building only needs to read the repository

jobs:
  build:
    runs-on: ubuntu-latest   # Use the latest Ubuntu runner provided by GitHub
    steps:
      # 1. Check out the repository contents
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Set up a Python environment
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 3. Install Sphinx and its themes/extensions
      - name: Install dependencies
        run: |
          pip install sphinx sphinx_rtd_theme sphinx-copybutton
          pip install -e .

      # 4. Build the HTML documentation
      - name: Build Sphinx docs
        run: |
          sphinx-build doc _build

      # 5. Package the built HTML for GitHub Pages (only on push to master)
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        with:
          path: _build/

  # The Pages source of this repository is "GitHub Actions" (Settings > Pages), so the
  # site is what this job deploys. Pushing the HTML to a gh-pages branch would not
  # publish it.
  deploy:
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write      # Deploy to GitHub Pages
      id-token: write   # Prove that the deployment comes from this repository
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:        # One deployment at a time, and never cancel one halfway
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
