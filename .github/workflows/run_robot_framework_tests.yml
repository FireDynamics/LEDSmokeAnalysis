# GitHub Actions workflow to run Robot Framework acceptance tests and upload logs
name: Run Robot Framework Tests

# Trigger workflow on pushes and PRs to master, except when only README.md changes
on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'README.md'

jobs:
  run_tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # A failure on one platform should not hide the result of the other
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash  # One script for both platforms; Windows runners ship Git Bash
    steps:
      # 1. Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Set up Python 3.10 (with pip cache enabled)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3. Install the LEDSA package (and its dependencies) from the repository root
      - name: Install LEDSA package and dependencies
        run: pip install .

      # 4. Reading or writing a text file without naming an encoding uses the one of the locale,
      #    which is cp1252 on a German Windows and cannot represent the characters LEDSA writes
      #    into its configs and reports. Every call has to say utf-8 (or utf-8-sig when reading a
      #    file users edit, so an editor's byte order mark does not end up in the first option).
      - name: Check that text I/O names an encoding
        run: |
          if grep -rnE "(^|[^.[:alnum:]_])open\(|\.read_text\(|\.write_text\(" --include='*.py' ledsa/ \
             | grep -v "encoding" \
             | grep -vE "'[rwax]b'|\"[rwax]b\"" \
             | grep -vE "Image\.open|ImageFactory\.open"; then
            echo "::error::the calls above do not name an encoding and would use cp1252 on Windows"
            exit 1
          fi

      # 5. Create a directory where Robot Framework will place its reports (HTML, XML, etc.)
      - name: Create folder for reports
        run: mkdir reports

      # 6. Execute Robot Framework acceptance tests located in ledsa/tests/AcceptanceTests
      #    The --outputdir option tells Robot where to store its output files.
      - name: Run Robot Framework Tests
        run: |
          python -m robot \
          --outputdir reports \
          ledsa/tests/AcceptanceTests

      # 7. Always upload the test logs & reports as a GitHub Actions artifact so they can be inspected
      - name: Upload Robot Framework logs
        if: always()  # Run this step regardless of test success/failure
        uses: actions/upload-artifact@v4
        with:
          name: robot-framework-logs-${{ matrix.os }}  # One artifact per platform
          path: reports/  # Directory (or file) to upload
